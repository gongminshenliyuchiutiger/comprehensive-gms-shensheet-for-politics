<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公民神會考神融會貫通問答系統(政治篇) - 互動式學習單網站</title>
  
  <!-- Font Awesome 6.5.1 CDN (全面使用 Font Awesome，無一般圖示) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- 主樣式表 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="brand-text">
          <h1>公民神會考神融會貫通問答系統(政治篇)</h1>
          <p><i class="fa-solid fa-award"></i> 邱俐瑜公民，成為公民神不再只是夢想！</p>
        </div>
      </div>
      <div class="nav-actions">
        <button class="btn btn-primary" id="btnPresentation" title="開啟課堂投影片展示模式">
          <i class="fa-solid fa-chalkboard-user"></i> 簡報展示模式
        </button>
        <button class="btn btn-outline" id="btnPrint" title="列印或匯出學習單">
          <i class="fa-solid fa-print"></i> 列印學習單
        </button>
        <button class="btn btn-outline" id="btnReset" title="清除所有進度重新練習">
          <i class="fa-solid fa-rotate-left"></i> 重設作答
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="main-wrapper">
    
    <!-- 學生個人資訊與簽名欄 -->
    <section class="student-card">
      <div class="student-card-title">
        <i class="fa-solid fa-id-card" style="color: var(--primary-color);"></i>
        <span>公民神會員</span>
      </div>
      <div class="student-inputs">
        <div class="input-group">
          <label for="studentClass"><i class="fa-solid fa-school"></i> 班級：</label>
          <input type="text" id="studentClass" placeholder="例如：901">
        </div>
        <div class="input-group">
          <label for="studentSeat"><i class="fa-solid fa-hashtag"></i> 座號：</label>
          <input type="text" id="studentSeat" placeholder="例如：12">
        </div>
        <div class="input-group">
          <label for="studentName"><i class="fa-solid fa-user-pen"></i> 姓名：</label>
          <input type="text" id="studentName" placeholder="請填寫姓名">
        </div>
      </div>
    </section>

    <!-- 學習成效儀表板（統計看板） -->
    <section class="stats-banner">
      <div class="stat-item">
        <div class="stat-icon blue">
          <i class="fa-solid fa-clipboard-question"></i>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="completedValue">0 / <span id="totalQuestionsCount">0</span></div>
          <div class="stat-label" id="completedLabel">已完成題數</div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-icon green">
          <i class="fa-solid fa-star"></i>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="scoreValue">0</div>
          <div class="stat-label" id="scoreLabel">目前積分</div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-icon purple">
          <i class="fa-solid fa-bullseye"></i>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="accuracyValue">0%</div>
          <div class="stat-label" id="accuracyLabel">答題正確率</div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-icon orange">
          <i class="fa-solid fa-medal"></i>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="badgeValue">準備啟航</div>
          <div class="stat-label" id="badgeLabel">當前實力階級</div>
        </div>
      </div>
    </section>

    <!-- 全局進度條 -->
    <div class="progress-card">
      <div class="progress-header">
        <span><i class="fa-solid fa-bars-progress"></i> <span id="progressTitleText">全卷完成進度</span></span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <!-- 單元切換導覽 Tabs -->
    <nav class="unit-nav" id="unitNav" aria-label="學習單元分類選單"></nav>

    <!-- 單元題目互動展示容器 -->
    <div id="unitsContainer"></div>

  </main>

  <!-- 網頁左下角吉祥物 (使用者指定關鍵需求) -->
  <!-- 懸停會霓虹彩色發光抖動，並可以拖曳移動到螢幕任何地方 (無對話框) -->
  <aside class="mascot-container" id="mascotContainer" title="懸停會霓虹發光抖動！可以拖曳到任何地方喔！">
    <img src="image/LiyuChillGuy.svg" alt="吉祥物 LiyuChillGuy" class="mascot-img" id="mascotImg">
    <div class="mascot-tag">
      <i class="fa-solid fa-hand"></i> <span>可任意拖曳</span>
    </div>
  </aside>

  <!-- 課堂教學專用 - 簡報展示模式覆蓋層 -->
  <div class="presentation-overlay" id="presentationOverlay">
    <div class="pres-header">
      <div class="pres-info">
        <div class="pres-unit-select-wrap">
          <i class="fa-solid fa-layer-group pres-unit-icon"></i>
          <select id="presUnitSelect" class="pres-unit-dropdown" title="直接切換單元開始播放"></select>
        </div>
        <span class="pres-step-badge" id="presStepBadge">第 1 / 54 題</span>
      </div>
      <div class="pres-controls">
        <button class="btn btn-outline pres-btn" id="btnPresToggleAnswer" title="揭曉或隱藏答案 (快速鍵：空白鍵)">
          <i class="fa-solid fa-eye"></i> <span id="presAnswerBtnText">揭曉答案</span>
        </button>
        <button class="btn btn-outline pres-btn" id="btnPresFullscreen" title="全螢幕切換 (快速鍵：F)">
          <i class="fa-solid fa-expand"></i> 全螢幕
        </button>
        <button class="btn btn-outline pres-btn close-pres-btn" id="btnPresClose" title="結束簡報模式 (快速鍵：Esc)">
          <i class="fa-solid fa-xmark"></i> 結束簡報
        </button>
      </div>
    </div>

    <div class="pres-body">
      <div class="pres-card" id="presCard">
        <!-- 動態注入題目投影片內容 -->
      </div>
    </div>

    <div class="pres-footer">
      <button class="btn btn-outline pres-nav-btn" id="btnPresPrev" title="上一題 (快速鍵：←)">
        <i class="fa-solid fa-chevron-left"></i> 上一題
      </button>
      <div class="pres-progress-bar-wrap">
        <div class="pres-progress-bar-fill" id="presProgressBarFill"></div>
      </div>
      <button class="btn btn-primary pres-nav-btn" id="btnPresNext" title="下一題 (快速鍵：→)">
        下一題 <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- 頁面下方版權聲明 (使用者指定關鍵需求: Copyright © Liyuchiutiger Gongminshen) -->
  <footer class="footer">
    <div class="footer-content">
      <div class="copyright-text">
        Copyright © Liyuchiutiger Gongminshen
      </div>
    </div>
  </footer>

  <!-- 載入資料與邏輯腳本 -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
